<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo 2: Metamorfose da Rã</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #eef9f5; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #ceebd5; }
        .btn-back { background: #11998e; color: white; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; }
        .btn-back:hover { background: #0e8076; }
        h1 { color: #137333; font-size: 1.8rem; }

        .instructions { background: #e6f4ea; padding: 12px 18px; border-radius: 8px; margin-bottom: 25px; color: #137333; font-weight: 500; }

        .stage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stage-card { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        
        .stage-badge { background: #11998e; color: white; font-weight: bold; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-bottom: 12px; }
        
        .stage-img-container { width: 100%; height: 180px; margin-bottom: 15px; border-radius: 8px; overflow: hidden; background: #e2e8f0; display: flex; align-items: center; justify-content: center; }
        .stage-img-container img { width: 100%; height: 100%; object-fit: contain; }

        select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #94a3b8; font-size: 0.95rem; background: white; cursor: pointer; }

        .btn-check { background: #27ae60; color: white; border: none; padding: 14px 30px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        .btn-check:hover { background: #219150; }

        .result-box { margin-top: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-nav">
        <h1>🐸 Jogo 2: Ciclo de Metamorfose da Rã</h1>
        <a href="index_ciencias.html" class="btn-back">⬅ Voltar ao Portal de Ciências</a>
    </div>

    <div class="instructions">
        💡 <strong>Desafio de Ordenação:</strong> Observe as imagens ampliadas e escolha a descrição correta para cada etapa do ciclo da rã!
    </div>

    <div class="stage-grid">
        <!-- Stage 1 -->
        <div class="stage-card">
            <div class="stage-badge">1</div>
            <div class="stage-img-container">
                <img src="../img/ciencias/ra_fase1.jpg" alt="Etapa 1" onerror="this.src='https://via.placeholder.com/200?text=🥚+Ovos+de+Rã'">
            </div>
            <select id="stage-1">
                <option value="">-- Escolha a descrição da 1ª Etapa --</option>
                <option value="4">Girino com duas pernas traseiras mais desenvolvidas</option>
                <option value="1">Ovos de rã fecundados. Esses ovos vão se tornar girinos.</option>
                <option value="6">Rã em forma de adulto, logo poderá se reproduzir</option>
            </select>
        </div>

        <!-- Stage 2 -->
        <div class="stage-card">
            <div class="stage-badge">2</div>
            <div class="stage-img-container">
                <img src="../img/ciencias/ra_fase2.jpg" alt="Etapa 2" onerror="this.src='https://via.placeholder.com/200?text=🐟+Girino+Recém-nascido'">
            </div>
            <select id="stage-2">
                <option value="">-- Escolha a descrição da 2ª Etapa --</option>
                <option value="2">Quando o girino sai do ovo, respira por meio de brânquias na cabeça.</option>
                <option value="5">Girino com quatro pernas e uma cauda que o ajuda a nadar</option>
                <option value="3">Girino desenvolve pulmões e precisa ir à superfície</option>
            </select>
        </div>

        <!-- Stage 3 -->
        <div class="stage-card">
            <div class="stage-badge">3</div>
            <div class="stage-img-container">
                <img src="../img/ciencias/ra_fase3.jpg" alt="Etapa 3" onerror="this.src='https://via.placeholder.com/200?text=🫧+Girino+com+Pulmões'">
            </div>
            <select id="stage-3">
                <option value="">-- Escolha a descrição da 3ª Etapa --</option>
                <option value="1">Ovos de rã fecundados</option>
                <option value="3">Girino com as pernas traseiras desenvolvidas. Nessa fase, desenvolve pulmões e vai à superfície.</option>
                <option value="6">Rã adulta</option>
            </select>
        </div>

        <!-- Stage 4 -->
        <div class="stage-card">
            <div class="stage-badge">4</div>
            <div class="stage-img-container">
                <img src="../img/ciencias/ra_fase4.jpg" alt="Etapa 4" onerror="this.src='https://via.placeholder.com/200?text=🦵+Pernas+Desenvolvendo'">
            </div>
            <select id="stage-4">
                <option value="">-- Escolha a descrição da 4ª Etapa --</option>
                <option value="4">Girino com duas pernas traseiras mais desenvolvidas e as dianteiras no início do desenvolvimento.</option>
                <option value="2">Girino sai do ovo</option>
                <option value="5">Girino com quatro pernas e cauda</option>
            </select>
        </div>

        <!-- Stage 5 -->
        <div class="stage-card">
            <div class="stage-badge">5</div>
            <div class="stage-img-container">
                <img src="../img/ciencias/ra_fase5.jpg" alt="Etapa 5" onerror="this.src='https://via.placeholder.com/200?text=🦎+Quatro+Pernas+e+Cauda'">
            </div>
            <select id="stage-5">
                <option value="">-- Escolha a descrição da 5ª Etapa --</option>
                <option value="3">Girino desenvolve pulmões</option>
                <option value="5">Girino com quatro pernas e uma cauda que o ajuda a nadar.</option>
                <option value="6">Rã em forma de adulto</option>
            </select>
        </div>

        <!-- Stage 6 -->
        <div class="stage-card">
            <div class="stage-badge">6</div>
            <div class="stage-img-container">
                <img src="../img/ciencias/ra_fase6.jpg" alt="Etapa 6" onerror="this.src='https://via.placeholder.com/200?text=🐸+Rã+Adulta'">
            </div>
            <select id="stage-6">
                <option value="">-- Escolha a descrição da 6ª Etapa --</option>
                <option value="1">Ovos de rã</option>
                <option value="4">Girino com duas pernas</option>
                <option value="6">Rã em forma de adulto, logo poderá se reproduzir e dar origem a outras rãs.</option>
            </select>
        </div>
    </div>

    <button class="btn-check" onclick="checkMetamorphosis()">Verificar Ordem da Metamorfose 🔄</button>

    <div id="result" class="result-box"></div>
</div>

<script>
    function checkMetamorphosis() {
        var answers = [
            document.getElementById('stage-1').value,
            document.getElementById('stage-2').value,
            document.getElementById('stage-3').value,
            document.getElementById('stage-4').value,
            document.getElementById('stage-5').value,
            document.getElementById('stage-6').value
        ];

        var correct = ["1", "2", "3", "4", "5", "6"];
        var score = 0;

        for(var i=0; i<6; i++) {
            if(answers[i] === correct[i]) score++;
        }

        var res = document.getElementById('result');
        if(score === 6) {
            res.textContent = "🎉 SENSACIONAL! Você organizou perfeitamente toda a metamorfose da rã!";
            res.style.color = "#27ae60";
        } else {
            res.textContent = `❌ Você acertou ${score} de 6 etapas. Revise a sequência do livro e tente novamente!`;
            res.style.color = "#c0392b";
        }
    }
</script>

</body>
</html>
